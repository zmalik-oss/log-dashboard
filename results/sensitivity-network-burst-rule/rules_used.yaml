# Rubric-to-rules configuration for the BETH risk triage pipeline.
# Most tuning should happen here, not in code. See docs/rubric-to-rules.md.

grouping:
  gap_seconds: 5.0        # events from the same host+process more than this far apart start a new action group

tiers:                    # from the project rubric (Iman's framework)
  medium_min: 40          # 40-69  -> flag for human investigation
  high_min: 70            # 70-100 -> high-priority alert

baseline:                 # learned from the training split, WITHOUT using sus/evil labels
  # (process,event) or (process,path) pairs seen this often in training are "routine".
  # Tuned on the attack-free VALIDATION split only: the largest value that keeps validation Medium+
  # alerts under 2% of action groups. The sweep (50 -> 6.1%, 20 -> 2.4%, 10 -> 1.9%, 5 -> 1.7%, 1 -> 1.2%)
  # is in docs/benchmark-protocol.md. The shipped default of 50 gave 6.1% false alarms on real BETH.
  routine_min_count: 10
  rare_process_max_count: 5   # processes seen fewer times than this in training are "rare"
  root_low_fraction: 0.05     # processes that run as root in < 5% of baseline events normally run unprivileged

repeat_threshold: 3       # this many failed risky attempts in one action group counts as "repeated"

# Event names grouped by what they can do. ADJUST after running `python -m triage describe`
# on the real BETH data: only names that actually appear in the data have any effect.
risky_syscalls:
  privilege_change: [setuid, setgid, setreuid, setregid, setresuid, setresgid, setfsuid, setfsgid, capset, commit_creds]
  process_control: [ptrace, process_vm_writev, process_vm_readv, kill, tkill, tgkill]
  system_modification: [init_module, finit_module, delete_module, mount, umount2, chroot, pivot_root]
  file_modification: [unlink, unlinkat, security_inode_unlink, rename, renameat, renameat2, security_inode_rename, chmod, fchmod, fchmodat, chown, fchown, lchown, fchownat]
  execution: [execve, execveat, security_bprm_check]
  network: [bind, listen, connect, accept, accept4, security_socket_connect, security_socket_bind, security_socket_listen, security_socket_accept]

# "high" categories drive the Suspicious Behavior factor (20/30). "medium" categories only reach 10 unless repeated.
category_severity:
  privilege_change: high
  process_control: high
  system_modification: high
  file_modification: high
  execution: medium
  network: medium

# Events whose args are parsed for file paths.
path_events: [openat, open, openat2, creat, security_file_open, security_bprm_check, execve, execveat,
              unlink, unlinkat, security_inode_unlink, rename, renameat, renameat2, security_inode_rename,
              chmod, fchmodat, chown, fchownat, access, faccessat, stat, lstat]
path_arg_names: [pathname, path, filename, oldpath, newpath, file]
write_flag_markers: [O_WRONLY, O_RDWR, O_CREAT, O_TRUNC, O_APPEND]

# Path tiers. Entries starting with "/" match as prefixes; others match as substrings.
# Order matters inside a tier (first match wins); "routine" is checked first.
sensitive_paths:
  routine:                # noisy system files every process touches; treated as normal
    - /etc/ld.so.cache
    - /etc/ld.so.conf
    - /etc/localtime
    - /etc/nsswitch.conf
    - /etc/resolv.conf
    - /etc/hosts
    - /etc/ssl/
    - /etc/ca-certificates
    - /etc/locale
    - /etc/alternatives/
    - /proc/self/
    - /proc/meminfo
    - /proc/cpuinfo
  critical:               # modifying these successfully (unexpectedly) scores the maximum resource points
    - /etc/shadow
    - /etc/passwd
    - /etc/sudoers
    - authorized_keys
    - /etc/ssh/sshd_config
    - /etc/ld.so.preload
    - /var/log/
    - /root/.ssh/
    - /proc/kcore
    - /dev/mem
    - /dev/kmem
  sensitive:
    - /etc/
    - id_rsa
    - .bash_history
    - /root/
    - /proc/
    - /.ssh/
  low:
    - /tmp/
    - /var/tmp/
    - /dev/shm/
    - /home/

world_writable_dirs: [/tmp/, /var/tmp/, /dev/shm/]

# Indicators of compromise ("confirmed malicious" signatures). These never read the sus/evil labels.
ioc:
  log_entries: [/var/log/]
  credential_entries: [/etc/shadow, /etc/passwd, /etc/sudoers, authorized_keys, /etc/ssh/sshd_config, /etc/ld.so.preload]
  module_events: [init_module, finit_module]
  # OPTIONAL, OFF BY DEFAULT, not part of the team's written rubric. When set to a number, an action group
  # with at least that many failed non-routine network calls (connect/bind/accept...) counts as an
  # indicator of compromise (port-scan or brute-force burst). The largest burst in attack-free train and
  # validation data is 16, so 100 is a defensible value. Turning it on is a team decision.
  network_burst_min_failures: 100
