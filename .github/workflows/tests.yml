name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: End-to-end run on synthetic sample
        run: |
          python scripts/make_sample_data.py
          python -m triage benchmark --data-dir data/sample --sample --out /tmp/artifacts --dashboard-dir /tmp/dashboard
