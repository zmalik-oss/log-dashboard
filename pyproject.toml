[project]
name = "beth-risk-triage"
version = "0.1.0"
description = "Rule-based, explainable risk triage for BETH host-event logs (AIT 670 group project)"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "numpy>=1.23", "pyyaml>=6.0", "scikit-learn>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
