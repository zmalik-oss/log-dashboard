<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event risk triage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0F172A; --panel:#1A2432; --panel2:#141C2B; --line:#2C3A4F; --text:#E2E8F0; --muted:#8B98AC;
    --high:#E4572E; --medium:#F2A93B; --low:#5FB489; --accent:#4FA8D8;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif; }
  .mono { font-family:"IBM Plex Mono",ui-monospace,monospace; }
  main { max-width:1180px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:20px; font-weight:600; margin:0; }
  h2 { font-size:14px; font-weight:600; margin:0 0 10px; }
  .sub { color:var(--muted); margin:2px 0 16px; }
  .banner { border:1px solid var(--medium); background:#2a2314; color:#f6dca4; padding:8px 12px; border-radius:4px; margin-bottom:14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px; }
  .strip { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-bottom:16px; }
  .strip > div { background:var(--panel); padding:12px 14px; border-left:1px solid var(--line); }
  .strip > div:first-child { border-left:0; }
  .strip .k { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:6px; }
  .strip .v { font:500 26px "IBM Plex Mono",monospace; }
  .strip .n { color:var(--muted); font-size:12px; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  @media (max-width:820px){ .grid2{grid-template-columns:1fr;} .strip{grid-template-columns:1fr 1fr;} .strip>div:nth-child(3){border-left:0;} }
  table { border-collapse:collapse; width:100%; }
  th { text-align:left; color:var(--muted); font-weight:500; font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:6px 8px; border-bottom:1px solid #1e293b; }
  td.num, th.num { text-align:right; font-family:"IBM Plex Mono",monospace; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-bottom:10px; }
  .toolbar label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  input[type=search] { background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:4px; padding:6px 8px; min-width:200px; }
  .tabs button { background:transparent; border:1px solid var(--line); color:var(--muted); padding:6px 12px; cursor:pointer; font:inherit; }
  .tabs button:first-child { border-radius:4px 0 0 4px; } .tabs button:last-child { border-radius:0 4px 4px 0; border-left:0; }
  .tabs button[aria-pressed=true] { background:var(--panel2); color:var(--text); border-color:var(--accent); }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .rowbtn { all:unset; cursor:pointer; display:grid; grid-template-columns:84px 1fr 90px 120px 70px 90px; gap:8px; align-items:center; width:100%; padding:8px 10px; border-bottom:1px solid #1e293b; }
  .rowbtn:hover { background:#1E293B; }
  .rowbtn:focus-visible { outline:2px solid var(--accent); }
  .head { display:grid; grid-template-columns:84px 1fr 90px 120px 70px 90px; gap:8px; padding:6px 10px; color:var(--muted); font-size:12px; border-bottom:1px solid var(--line); }
  .detail { background:var(--panel2); padding:12px 14px 14px 34px; border-bottom:1px solid #1e293b; display:grid; grid-template-columns:1fr 1fr; gap:14px 24px; }
  @media (max-width:820px){ .detail{grid-template-columns:1fr; padding-left:14px;} .rowbtn,.head{grid-template-columns:70px 1fr 60px;} .rowbtn>*:nth-child(n+4),.head>*:nth-child(n+4){display:none;} }
  .factor { margin-bottom:8px; }
  .factor .top { display:flex; justify-content:space-between; font-size:12px; }
  .bar { height:6px; background:#243247; border-radius:3px; margin:3px 0; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .why { color:var(--muted); font-size:12px; }
  .tag { display:inline-block; border:1px solid var(--line); border-radius:3px; padding:1px 6px; margin:0 4px 4px 0; font-size:12px; color:var(--text); }
  .ev { font:12px "IBM Plex Mono",monospace; color:var(--muted); word-break:break-all; }
  .empty { padding:22px; text-align:center; color:var(--muted); }
  .flag { color:var(--medium); }
  svg text { fill:var(--muted); font:11px "IBM Plex Sans",sans-serif; }
</style>
</head>
<body>
<main id="app"></main>
<script src="results.js"></script>
<script>
(function () {
  var app = document.getElementById("app");
  var R = window.RESULTS;
  if (!R) {
    app.innerHTML = '<div class="empty">No results loaded. Run <span class="mono">python -m triage benchmark --data-dir data/beth</span> to create <span class="mono">dashboard/results.js</span>, then reload.</div>';
    return;
  }
  var TIER = { high: "High", medium: "Medium", low: "Low" };
  var ACTION = { high: "Immediate human investigation", medium: "Flag for investigation", low: "Auto-logged, no review" };
  var MAX = { behavior: 40, privilege: 20, resource: 20, supporting: 20 };
  var LABEL = { behavior: "Suspicious behavior", privilege: "Privilege use", resource: "Sensitive resources", supporting: "Supporting evidence" };
  var DIS = { malicious_label_scored_low: "Labeled malicious, scored Low", benign_label_scored_high: "Labeled benign, scored High" };
  var state = { tiers: { high: true, medium: true, low: false }, q: "", tab: "all", open: null, limit: 80 };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pct(x) { return (100 * x).toFixed(1) + "%"; }
  function dot(t) { return '<span class="dot" style="background:var(--' + t + ')"></span>'; }

  var W = R.metrics.framework_test.workload;
  var tiers = R.summary.tiers, total = R.summary.total_groups;

  function header() {
    return '<h1>Event risk triage</h1><p class="sub">Each row is one action group (related events from one process). Scores follow the four-factor rubric; tiers are Low &lt; ' +
      R.meta.tiers.medium_min + ', Medium ' + R.meta.tiers.medium_min + '&ndash;' + (R.meta.tiers.high_min - 1) + ', High &ge; ' + R.meta.tiers.high_min + '.</p>' +
      (R.meta.n_events ? '<p class="sub" style="margin-top:-8px">Data: ' + esc(R.meta.source) + ', ' + R.meta.n_events.toLocaleString() + ' events in ' + R.meta.n_groups.toLocaleString() +
        ' action groups. Routine threshold ' + R.meta.routine_min_count + (R.meta.network_burst_min_failures ? '; optional network-burst rule on (' + R.meta.network_burst_min_failures + '+ failed calls)' : '; rubric as written') + '.</p>' : '') +
      (R.meta.is_sample ? '<div class="banner">Synthetic sample data. These results test the pipeline and are not BETH results.</div>' : '') +
      '<div class="strip">' +
      ["high", "medium", "low"].map(function (t) {
        return '<div><div class="k">' + dot(t) + TIER[t] + '</div><div class="v" style="color:var(--' + t + ')">' + (tiers[t] || 0).toLocaleString() +
          '</div><div class="n">' + ACTION[t] + '</div></div>';
      }).join("") +
      '<div><div class="k">Analyst workload</div><div class="v">' + pct(1 - W.review_reduction_vs_all_groups) +
      '</div><div class="n">of ' + total.toLocaleString() + ' groups need review</div></div></div>';
  }

  function histogram() {
    var h = R.summary.histogram, mx = Math.max.apply(null, h.map(function (c) { return Math.log1p(c); })) || 1;
    var w = 420, ht = 150, bw = 34, gap = 6, out = '<svg viewBox="0 0 ' + w + ' ' + (ht + 28) + '" width="100%" role="img" aria-label="Distribution of risk scores, log scale">';
    h.forEach(function (c, i) {
      var t = i * 10 >= R.meta.tiers.high_min ? "high" : (i * 10 >= R.meta.tiers.medium_min ? "medium" : "low");
      var bh = Math.max(c ? 2 : 0, (Math.log1p(c) / mx) * (ht - 14)), x = 8 + i * (bw + gap);
      out += '<rect x="' + x + '" y="' + (ht - bh) + '" width="' + bw + '" height="' + bh + '" rx="2" fill="var(--' + t + ')"><title>' + (i * 10) + '&ndash;' + (i * 10 + 9) + ': ' + c + ' groups</title></rect>';
      if (c) out += '<text x="' + (x + bw / 2) + '" y="' + (ht - bh - 3) + '" text-anchor="middle">' + c + '</text>';
      out += '<text x="' + (x + bw / 2) + '" y="' + (ht + 14) + '" text-anchor="middle">' + (i * 10) + '</text>';
    });
    return out + '</svg>';
  }

  function metricsTable() {
    var f = R.metrics.framework_test;
    function r(name, m) { return '<tr><td>' + name + '</td><td class="num">' + m.precision.toFixed(3) + '</td><td class="num">' + m.recall.toFixed(3) + '</td><td class="num">' + m.alerts + '</td></tr>'; }
    var fa = R.metrics.false_alarms_validation;
    return '<table><thead><tr><th>Event-level, vs. evil label</th><th class="num">Precision</th><th class="num">Recall</th><th class="num">Alerts</th></tr></thead><tbody>' +
      r("Rubric, Medium+", f.event_medium_plus) + r("Rubric, High", f.event_high_only) + r("Baseline: sus flag", R.metrics.baseline_sus) +
      r("Baseline: Isolation Forest", R.metrics.baseline_iforest) + '</tbody></table>' +
      '<p class="why" style="margin:10px 0 0">False-alarm check on the attack-free validation split: ' + (100 * fa.group_alert_rate_medium_plus).toFixed(2) + '% of groups reach Medium or higher.</p>';
  }

  function visible() {
    var q = state.q.trim().toLowerCase();
    return R.groups.filter(function (g) {
      if (state.tab === "review") { if (!g.disagreement) return false; }
      else if (!state.tiers[g.tier]) return false;
      if (!q) return true;
      return (g.processName + " " + g.hostName + " " + g.processId + " " + g.evidence.join(" ")).toLowerCase().indexOf(q) >= 0;
    });
  }

  function detail(g) {
    var f = ["behavior", "privilege", "resource", "supporting"].map(function (k) {
      return '<div class="factor"><div class="top"><span>' + LABEL[k] + '</span><span class="mono">' + g[k] + ' / ' + MAX[k] + '</span></div>' +
        '<div class="bar"><i style="width:' + (100 * g[k] / MAX[k]) + '%"></i></div><div class="why">' + esc(g.reasons[k]) + '</div></div>';
    }).join("");
    var tags = g.indicators.length ? g.indicators.map(function (i) { return '<span class="tag">' + esc(i.replace(/_/g, " ")) + '</span>'; }).join("") : '<span class="why">none</span>';
    var ev = g.evidence.length ? g.evidence.map(function (e) { return '<div class="ev">' + esc(e) + '</div>'; }).join("") : '<span class="why">No flagged events</span>';
    var lab = 'Dataset labels: sus=' + g.sus_any + ', evil=' + g.evil_any + (g.disagreement ? ' &mdash; <span class="flag">' + DIS[g.disagreement] + '</span>' : '');
    return '<div class="detail"><div>' + f + '</div><div><h2>Indicators</h2><div style="margin-bottom:10px">' + tags + '</div><h2>Flagged events</h2>' + ev +
      '<p class="why" style="margin-top:12px">' + lab + '<br>' + g.n_events + ' events, host ' + esc(g.hostName) + ', pid ' + g.processId + ', parent ' + g.parentProcessId + '</p></div></div>';
  }

  function table() {
    var rows = visible(), shown = rows.slice(0, state.limit);
    var html = '<div class="head"><span>Tier</span><span>Process</span><span>Score</span><span>Host</span><span>Events</span><span>t (s)</span></div>';
    if (!rows.length) return html + '<div class="empty">' + (state.tab === "review" ? "No label disagreements in this run." : "No groups match the current filters.") + '</div>';
    shown.forEach(function (g) {
      var open = state.open === g.group_id;
      html += '<button class="rowbtn" data-id="' + g.group_id + '" aria-expanded="' + open + '"><span>' + dot(g.tier) + ' ' + TIER[g.tier] + '</span><span>' + esc(g.processName) +
        '</span><span class="mono">' + g.score + '</span><span class="mono why">' + esc(g.hostName) + '</span><span class="mono">' + g.n_events + '</span><span class="mono why">' + Math.round(g.first_ts) + '</span></button>';
      if (open) html += detail(g);
    });
    if (rows.length > shown.length) html += '<div class="empty"><button id="more" class="tabs" style="all:unset;cursor:pointer;color:var(--accent)">Show ' + Math.min(80, rows.length - shown.length) + ' more (' + (rows.length - shown.length) + ' hidden)</button></div>';
    return html;
  }

  function controls() {
    var nrev = R.groups.filter(function (g) { return g.disagreement; }).length;
    return '<div class="toolbar"><div class="tabs" role="group" aria-label="View"><button data-tab="all" aria-pressed="' + (state.tab === "all") + '">Triage queue</button>' +
      '<button data-tab="review" aria-pressed="' + (state.tab === "review") + '">Label disagreements (' + nrev + ')</button></div>' +
      (state.tab === "all" ? ["high", "medium", "low"].map(function (t) {
        return '<label><input type="checkbox" data-tier="' + t + '"' + (state.tiers[t] ? " checked" : "") + '>' + dot(t) + TIER[t] + '</label>';
      }).join("") : '<span class="why">Where the rubric and the dataset label disagree. Review each by hand.</span>') +
      '<input type="search" id="q" placeholder="process, host, pid, path" value="' + esc(state.q) + '" aria-label="Search groups"></div>';
  }

  function render(keepFocus) {
    var hadFocus = keepFocus && document.activeElement && document.activeElement.id === "q";
    app.innerHTML = header() +
      '<div class="grid2"><div class="panel"><h2>Score distribution (log scale)</h2>' + histogram() + '</div><div class="panel"><h2>Benchmark (test split)</h2>' + metricsTable() + '</div></div>' +
      '<div class="panel" style="padding:0"><div style="padding:14px 14px 0">' + controls() + '</div>' + table() + '</div>';
    if (hadFocus) { var el = document.getElementById("q"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab],[data-id],#more");
    if (!t) return;
    if (t.dataset.tab) { state.tab = t.dataset.tab; state.open = null; state.limit = 80; }
    else if (t.dataset.id) { var id = +t.dataset.id; state.open = state.open === id ? null : id; }
    else if (t.id === "more") state.limit += 80;
    render();
  });
  app.addEventListener("change", function (e) { if (e.target.dataset.tier) { state.tiers[e.target.dataset.tier] = e.target.checked; state.limit = 80; render(); } });
  app.addEventListener("input", function (e) { if (e.target.id === "q") { state.q = e.target.value; state.limit = 80; render(true); } });
  render();
})();
</script>
</body>
</html>
